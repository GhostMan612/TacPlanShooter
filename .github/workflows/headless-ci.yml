name: Headless CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot headless
        id: cache
        uses: actions/cache@v4
        with:
          path: ./bin/godot
          key: godot-4.0.4-linux-headless
      - name: Download Godot 4.0.4 headless (Linux x86_64)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p bin
          curl -sSL -o bin/Godot_v4.0.4-stable_linux.x86_64.zip https://github.com/godotengine/godot/releases/download/4.0.4-stable/Godot_v4.0.4-stable_linux.x86_64.zip
          (cd bin && unzip -o Godot_v4.0.4-stable_linux.x86_64.zip && mv Godot_v4.0.4-stable_linux.x86_64 godot && chmod +x godot)
          ls -la bin
      - name: Import pass 1
        run: |
          timeout 45 stdbuf -oL -eL ./bin/godot --headless --path . --editor --quit 2>&1 | tee import1.log || true
      - name: Import pass 2
        run: |
          timeout 45 stdbuf -oL -eL ./bin/godot --headless --path . --editor --quit 2>&1 | tee import2.log || true
          test -f .godot/global_script_class_cache.cfg
      - name: Boot smoke
        run: |
          timeout 30 stdbuf -oL -eL ./bin/godot --headless --path . --quit 2>&1 | tee boot.log || true
          cat boot.log
          if grep -E "ERROR|SCRIPT ERROR|Parse" boot.log; then exit 1; fi
      - name: Determinism harness
        run: |
          timeout 60 stdbuf -oL -eL ./bin/godot --headless --path . -s res://tests/determinism_harness.gd 2>&1 | tee determinism.log || true
          cat determinism.log
          if grep -E "FAIL|ERROR|SCRIPT ERROR|Parse" determinism.log; then exit 1; fi
          grep -q "PASS" determinism.log
      - name: Meta progression harness
        run: |
          timeout 60 stdbuf -oL -eL ./bin/godot --headless --path . -s res://tests/meta_progression_harness.gd 2>&1 | tee meta_progression.log || true
          cat meta_progression.log
          if grep -E "FAIL|ERROR|SCRIPT ERROR|Parse" meta_progression.log; then exit 1; fi
          grep -q "PASS" meta_progression.log
      - name: UI polish audit (M6 Phase J)
        run: |
          timeout 60 stdbuf -oL -eL ./bin/godot --headless --path . -s res://tests/ui_polish_audit.gd 2>&1 | tee ui_polish_audit.log || true
          cat ui_polish_audit.log
          if grep -E "FAIL|ERROR|SCRIPT ERROR|Parse" ui_polish_audit.log; then exit 1; fi
          grep -q "PASS" ui_polish_audit.log
      - name: Map validation harness
        run: |
          timeout 60 stdbuf -oL -eL ./bin/godot --headless --path . -s res://tests/map_validation_harness.gd 2>&1 | tee map_validation.log || true
          cat map_validation.log
          if grep -E "FAIL|ERROR|SCRIPT ERROR|Parse" map_validation.log; then exit 1; fi
          grep -q "PASS" map_validation.log
      - name: UI audio smoke
        run: |
          timeout 60 stdbuf -oL -eL ./bin/godot --headless --path . -s res://tests/ui_audio_smoke.gd 2>&1 | tee ui_audio_smoke.log || true
          cat ui_audio_smoke.log
          if grep -E "FAIL|ERROR|SCRIPT ERROR|Parse" ui_audio_smoke.log; then exit 1; fi
          grep -q "PASS" ui_audio_smoke.log
      - name: Map editor harness
        run: |
          timeout 60 stdbuf -oL -eL ./bin/godot --headless --path . -s res://tests/map_editor_harness.gd 2>&1 | tee map_editor.log || true
          cat map_editor.log
          if grep -E "FAIL|ERROR|SCRIPT ERROR|Parse" map_editor.log; then exit 1; fi
          grep -q "PASS" map_editor.log
      - name: SimClock probe
        run: |
          timeout 30 stdbuf -oL -eL ./bin/godot --headless --path . res://tests/simclock_probe.tscn --quit 2>&1 | tee simclock.log || true
          cat simclock.log
          if grep -E "ERROR|SCRIPT ERROR|Parse" simclock.log; then exit 1; fi
