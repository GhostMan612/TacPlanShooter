name: Headless CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Cache Godot headless
        id: cache
        uses: actions/cache@v4
        with:
          path: ./bin/godot
          key: godot-4.0.4-linux-headless
      - name: Download Godot 4.0.4 headless (Linux x86_64)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p bin
          curl -sSL -o bin/Godot_v4.0.4-stable_linux.x86_64.zip https://github.com/godotengine/godot/releases/download/4.0.4-stable/Godot_v4.0.4-stable_linux.x86_64.zip
          (cd bin && unzip -o Godot_v4.0.4-stable_linux.x86_64.zip && mv Godot_v4.0.4-stable_linux.x86_64 godot && chmod +x godot)
          ls -la bin
      - name: Import pass 1 (waits for the editor scan to write the class cache)
        run: |
          ./bin/godot --headless --path . --editor > import1.log 2>&1 &
          pid=$!
          for i in $(seq 1 110); do
            if [ -f .godot/global_script_class_cache.cfg ] && [ "$(wc -c < .godot/global_script_class_cache.cfg)" -gt 1000 ]; then
              echo "class cache written after ${i}s"
              break
            fi
            sleep 1
          done
          sleep 3
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          cat import1.log
          [ "$(wc -c < .godot/global_script_class_cache.cfg)" -gt 1000 ]
      - name: Import pass 2 (refreshes dependents of new classes)
        run: |
          ./bin/godot --headless --path . --editor > import2.log 2>&1 &
          pid=$!
          sleep 15
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          cat import2.log
          [ "$(wc -c < .godot/global_script_class_cache.cfg)" -gt 1000 ]
      - name: Parse gate (every script and scene)
        run: |
          timeout 120 stdbuf -oL -eL ./bin/godot --headless --path . res://tests/parse_all.tscn 2>&1 | tee parse_all.log || true
          bash tools/ci_gate.sh parse_all.log "[PARSE_ALL] RESULT PASS"
      - name: Boot smoke (main scene)
        if: ${{ !cancelled() }}
        run: |
          timeout 120 stdbuf -oL -eL ./bin/godot --headless --path . --quit 2>&1 | tee boot.log || true
          bash tools/ci_gate.sh boot.log "[TacPlan] screen=splash"
      - name: Scene smoke (every screen)
        if: ${{ !cancelled() }}
        run: |
          timeout 120 stdbuf -oL -eL ./bin/godot --headless --path . res://tests/scene_smoke.tscn 2>&1 | tee scene_smoke.log || true
          bash tools/ci_gate.sh scene_smoke.log "[SMOKE] RESULT PASS"
      - name: Determinism harness
        if: ${{ !cancelled() }}
        run: |
          timeout 120 stdbuf -oL -eL ./bin/godot --headless --path . --script res://tests/determinism_harness.gd 2>&1 | tee determinism.log || true
          bash tools/ci_gate.sh determinism.log "PASS"
      - name: AAA AI harness
        if: ${{ !cancelled() }}
        run: |
          timeout 120 stdbuf -oL -eL ./bin/godot --headless --path . --script res://tests/aaa_ai_harness.gd 2>&1 | tee aaa_ai.log || true
          bash tools/ci_gate.sh aaa_ai.log "[AAA_AI] RESULT PASS"
      - name: Meta progression harness
        if: ${{ !cancelled() }}
        run: |
          timeout 120 stdbuf -oL -eL ./bin/godot --headless --path . --script res://tests/meta_progression_harness.gd 2>&1 | tee meta_progression.log || true
          bash tools/ci_gate.sh meta_progression.log "PASS"
      - name: UI polish audit
        if: ${{ !cancelled() }}
        run: |
          timeout 120 stdbuf -oL -eL ./bin/godot --headless --path . --script res://tests/ui_polish_audit.gd 2>&1 | tee ui_polish_audit.log || true
          bash tools/ci_gate.sh ui_polish_audit.log "PASS"
      - name: Map validation harness
        if: ${{ !cancelled() }}
        run: |
          timeout 120 stdbuf -oL -eL ./bin/godot --headless --path . --script res://tests/map_validation_harness.gd 2>&1 | tee map_validation.log || true
          bash tools/ci_gate.sh map_validation.log "PASS"
      - name: Tileset theme contract
        if: ${{ !cancelled() }}
        run: |
          timeout 120 stdbuf -oL -eL ./bin/godot --headless --path . --script res://tests/tileset_theme_harness.gd 2>&1 | tee tileset_theme.log || true
          bash tools/ci_gate.sh tileset_theme.log "[THEME] RESULT PASS"
      - name: UI audio smoke
        if: ${{ !cancelled() }}
        run: |
          timeout 120 stdbuf -oL -eL ./bin/godot --headless --path . --script res://tests/ui_audio_smoke.gd 2>&1 | tee ui_audio_smoke.log || true
          bash tools/ci_gate.sh ui_audio_smoke.log "PASS"
      - name: Map editor harness
        if: ${{ !cancelled() }}
        run: |
          timeout 120 stdbuf -oL -eL ./bin/godot --headless --path . --script res://tests/map_editor_harness.gd 2>&1 | tee map_editor.log || true
          bash tools/ci_gate.sh map_editor.log "PASS"
      - name: Fog layer cache and mask harness
        if: ${{ !cancelled() }}
        run: |
          timeout 120 stdbuf -oL -eL ./bin/godot --headless --path . --script res://tests/fog_layer_harness.gd 2>&1 | tee fog_layer.log || true
          bash tools/ci_gate.sh fog_layer.log "[FOG] RESULT PASS"
      - name: SimClock probe (FPS caps 30/60)
        if: ${{ !cancelled() }}
        run: |
          timeout 120 stdbuf -oL -eL ./bin/godot --headless --path . res://tests/simclock_probe.tscn 2>&1 | tee simclock.log || true
          bash tools/ci_gate.sh simclock.log "planning_cap=30" "execution_cap=60" "back_to_planning_cap=30"
